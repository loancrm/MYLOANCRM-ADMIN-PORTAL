<div class="m-2 p-1">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center pointer-cursor" (click)="goBack()">
      <span class="me-2"><img src="../../../../assets/images/icons/left-arrow.svg" alt="Back" /></span>
      <b>Master Locations</b>
    </div>
    <button pButton type="button" icon="pi pi-plus" class="p-button-primary" (click)="openCreate()">&nbsp;Add Location</button>
  </div>

  <div class="mb-3 d-flex gap-2">
    <input pInputText [(ngModel)]="searchText" placeholder="Search locations..." style="width:260px" (keyup.enter)="onSearch()" />
    <button pButton type="button" icon="pi pi-search" class="p-button-outlined" (click)="onSearch()"></button>
  </div>

  <p-table
    [value]="locations" [lazy]="true" [totalRecords]="totalRecords" [loading]="loading"
    [paginator]="true" [rows]="pageSize" [rowsPerPageOptions]="[10,20,50]"
    (onPage)="onPageChange($event)" responsiveLayout="scroll" styleClass="p-datatable-customers"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} locations" [showCurrentPageReport]="true"
  >
    <ng-template pTemplate="header">
      <tr><th>Location Name</th><th>State</th><th>Status</th><th>Actions</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-loc>
      <tr>
        <td><b>{{ loc.locationName }}</b></td>
        <td>{{ loc.state || '—' }}</td>
        <td><span class="badge" [ngClass]="loc.status === 1 ? 'bg-success' : 'bg-secondary'">{{ loc.status === 1 ? 'Active' : 'Inactive' }}</span></td>
        <td>
          <img src="../../../../assets/images/icons/edit.svg" width="22" height="22"
               pTooltip="Edit" tooltipPosition="top" class="pointer-cursor" (click)="openEdit(loc)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="4" class="text-center py-4">
        <img src="../../../../assets/images/menu/no-data.gif" width="120" alt="No data" /><br />
        <span class="text-muted">No locations found</span>
      </td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="showDialog" [header]="editMode ? 'Edit Location' : 'Add Location'" [modal]="true" [style]="{width:'420px'}" [draggable]="false">
  <div class="p-fluid">
    <div class="field mb-3">
      <label class="fw-semibold">Location Name <span class="text-danger">*</span></label>
      <input pInputText [(ngModel)]="form.locationName" placeholder="e.g. Bangalore" class="mt-1" />
    </div>
    <div class="field mb-3">
      <label class="fw-semibold">State</label>
      <input pInputText [(ngModel)]="form.state" placeholder="e.g. Karnataka" class="mt-1" />
    </div>
    <div class="field mb-3" *ngIf="editMode">
      <label class="fw-semibold">Status</label>
      <p-dropdown [(ngModel)]="form.status" [options]="[{label:'Active',value:1},{label:'Inactive',value:0}]" optionLabel="label" optionValue="value" class="mt-1 w-100"></p-dropdown>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancel" class="p-button-text" (click)="showDialog=false"></button>
    <button pButton type="button" [label]="editMode ? 'Update' : 'Create'" [loading]="saving" (click)="save()"></button>
  </ng-template>
</p-dialog>
