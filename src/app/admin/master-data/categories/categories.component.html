<div class="m-2 p-1">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center pointer-cursor" (click)="goBack()">
      <span class="me-2"
        ><img src="../../../../assets/images/icons/left-arrow.svg" alt="Back"
      /></span>
      <b>Company Categories</b>
    </div>
    <button
      pButton
      type="button"
      icon="pi pi-plus"
      class="p-button-primary"
      (click)="openCreate()"
    >
      &nbsp;Add Category
    </button>
  </div>

  <p-table
    [value]="categories"
    [loading]="loading"
    responsiveLayout="scroll"
    styleClass="p-datatable-customers"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Category Name</th>
        <th>Code</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-cat>
      <tr>
        <td>
          <b>{{ cat.categoryName }}</b>
        </td>
        <td>
          <code>{{ cat.categoryCode || "—" }}</code>
        </td>
        <td>
          <span
            class="badge"
            [ngClass]="cat.status === 1 ? 'bg-success' : 'bg-secondary'"
            >{{ cat.status === 1 ? "Active" : "Inactive" }}</span
          >
        </td>
        <td>
          <img
            src="../../../../assets/images/icons/edit.svg"
            width="22"
            height="22"
            pTooltip="Edit"
            tooltipPosition="top"
            class="pointer-cursor"
            (click)="openEdit(cat)"
          />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center py-4">
          <img
            src="../../../../assets/images/menu/no-data.gif"
            width="120"
            alt="No data"
          /><br />
          <span class="text-muted">No categories found</span>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [(visible)]="showDialog"
  [header]="editMode ? 'Edit Category' : 'Add Category'"
  [modal]="true"
  [style]="{ width: '400px' }"
  [draggable]="false"
>
  <div class="p-fluid">
    <div class="field mb-3">
      <label class="fw-semibold"
        >Category Name <span class="text-danger">*</span></label
      >
      <input
        pInputText
        [(ngModel)]="form.categoryName"
        placeholder="e.g. IT / Software"
        class="mt-1"
      />
    </div>
    <div class="field mb-3">
      <label class="fw-semibold">Category Code</label>
      <input
        pInputText
        [(ngModel)]="form.categoryCode"
        placeholder="e.g. IT"
        class="mt-1"
        style="text-transform: uppercase"
      />
      <small class="text-muted">Used in Excel upload column</small>
    </div>
    <div class="field mb-3" *ngIf="editMode">
      <label class="fw-semibold">Status</label>
      <p-dropdown
        [(ngModel)]="form.status"
        [options]="[
          { label: 'Active', value: 1 },
          { label: 'Inactive', value: 0 },
        ]"
        optionLabel="label"
        optionValue="value"
        class="mt-1 w-100"
      ></p-dropdown>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Cancel"
      class="p-button-text"
      (click)="showDialog = false"
    ></button>
    <button
      pButton
      type="button"
      [label]="editMode ? 'Update' : 'Create'"
      [loading]="saving"
      (click)="save()"
    ></button>
  </ng-template>
</p-dialog>
