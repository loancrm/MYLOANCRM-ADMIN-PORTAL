<div class="m-2 p-1">
  <div class="d-flex align-items-center mb-3">
    <i
      class="pi pi-database me-2"
      style="font-size: 1.4rem; color: #7571f8"
    ></i>
    <h4 class="mb-0 fw-bold">Master Data Management</h4>
  </div>

  <div class="row g-3">
    <div class="col-md-4" *ngFor="let section of sections">
      <div
        class="card h-100 pointer-cursor section-card"
        (click)="navigate(section.route)"
      >
        <div class="card-body d-flex align-items-start gap-3 p-4">
          <div class="section-icon">
            <i
              [class]="section.icon"
              style="font-size: 1.5rem; color: #7571f8"
            ></i>
          </div>
          <div>
            <h6 class="fw-bold mb-1">{{ section.label }}</h6>
            <p class="text-muted mb-0 small">{{ section.desc }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
